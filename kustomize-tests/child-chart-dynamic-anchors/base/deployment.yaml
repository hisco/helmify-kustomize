apiVersion: apps/v1
kind: Deployment
metadata:
  name: child-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: child-app
  template:
    metadata:
      labels:
        app: child-app
    spec:
      containers:
      - name: app
        image: child-app:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"