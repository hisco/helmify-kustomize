
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
- name: base-environment-values
  env: .env
resources:
- deployment.yaml
replacements:
- source:
    fieldPath: data.IMAGE_URL
    kind: ConfigMap
    name: base-environment-values
  targets:
  - fieldPaths:
    - spec.template.spec.containers.[name=nginx].image
    options:
      create: true
    select:
      kind: Deployment
      name: nginx-deployment